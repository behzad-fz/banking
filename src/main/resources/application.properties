#debug=true
spring.profiles.active=secrets
server.port= 9001

# JWT HS256 signing key, base64-encoded. MUST be provided at runtime
# (e.g. environment variable JWT_SECRET); the app fails fast if it is absent.
# Never commit a real value. See docs/jwt-key-management.md for rotation.
jwt.secret=${JWT_SECRET}

# TypeSafe AI (optional). When the API key is blank, natural-language date
# parsing is disabled and only the deterministic formats are accepted.
typesafe.api-key=${TYPESAFE_API_KEY:}
typesafe.model=jev-latest
typesafe.timeout=3s
